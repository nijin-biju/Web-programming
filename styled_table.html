<!DOCTYPE HTML>
<html>
<head>
<title> Styled Table </title>
<style>
#studentTable {
            width: 80%;
            font-family: Arial, sans-serif;
            border-collapse: collapse;
        }
        #studentTable th {
            padding: 12px;
            text-align: left;
            background-color: #4CAF50;
            color: white;
            border: 1px solid #333;
        }
        #studentTable td {
            padding: 10px;
            border: 1px solid #333;
        }
        #studentTable tr {
            border: 1px solid #333;
        }
        #studentTable tr:nth-child(even) {
            background-color: #ddd;
        }
        #studentTable tr:nth-child(even):hover {
            background-color: lightgreen;
        }
        #studentTable tr:hover {
            background-color: yellow;
        }
</style>
</head>
<body>
<h2>Student Details</h2>
<table id="studentTable">
<tr>
<th>Name</th>
<th>Age</th>
<th>Course</th>
</tr>

<tr>
<td>Nijin</td>
<td>22</td>
<td>MCA</td>
</tr>

<tr>
<td>Zen</td>
<td>21</td>
<td> MCA </td>
</tr>

<tr>
<td>VishnuPooja</td>
<td>21</td>
<td>MCA</td>
</tr>	
<tr>
<td>Vidya Sankara</td>
<td>21</td>
<td>MCA</td>
</tr>	
</table>
</body>
</html>
