<!DOCTYPE html>
<html>
<head>
    <title>HTML Image Map - Tree</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8f0;
        }

        h1, h2 {
            color: darkgreen;
        }

        #tree {
            width: 490px;
            height: 600px;
        }

        #details {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid green;
            border-radius: 10px;
        }

        #partImage {
            width: 250px;
            max-height: 250px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>HTML Image Map</h1>

    <p>Click on the roots, trunk, branches, or leaves to view their details.</p>

    <!-- Tree Image -->
    <img src="/home/s1mcabatch2/Downloads/Tree.jpeg"
         alt="Tree"
         id="tree"
         usemap="#treemap"
         width="490"
         height="600">

    <!-- Image Map -->
    <map name="treemap">

        <!-- Circle: Leaves -->
        <area shape="circle"
              coords="250,100,75"
              href="#details"
              alt="Leaves"
              onclick="showInfo('Leaves',
              'Leaves prepare food through photosynthesis. They absorb sunlight and exchange gases.',
              '/home/s1mcabatch2/Downloads/leaves.jpeg'); return false;">

        <!-- Rectangle: Trunk -->
        <area shape="rect"
              coords="220,200,280,400"
              href="#details"
              alt="Trunk"
              onclick="showInfo('Trunk',
              'The trunk supports the tree, holds its branches upright, and transports water and nutrients.',
              '/home/s1mcabatch2/Downloads/trunk.jpeg'); return false;">

        <!-- Polygon: Branches -->
        <area shape="poly"
              coords="180,190,220,160,260,180,330,165,360,190,300,210,250,220,200,215"
              href="#details"
              alt="Branches"
              onclick="showInfo('Branches',
              'Branches support the leaves, flowers, and fruits. They help transport water and nutrients.',
              '/home/s1mcabatch2/Downloads/branches.jpeg'); return false;">

        <!-- Polygon: Roots -->
        <area shape="poly"
              coords="210,390,280,390,330,440,430,490,380,530,300,500,250,590,200,560,150,590,110,530,70,490,150,440"
              href="#details"
              alt="Roots"
              onclick="showInfo('Roots',
              'Roots anchor the tree in the soil, absorb water and minerals, and may store food.',
              '/home/s1mcabatch2/Downloads/roots.jpeg'); return false;">

    </map>

    <!-- Information Section -->
    <div id="details">

        <h2 id="heading">Tree Information</h2>

        <img id="partImage"
             src=""
             alt="Selected tree part"
             hidden>

        <p id="info">Click on a part of the tree to view its details.</p>

    </div>

    <script>
        function showInfo(title, message, imagePath) {

            document.getElementById("heading").textContent = title;

            document.getElementById("info").textContent = message;

            var image = document.getElementById("partImage");

            image.src = imagePath;
            image.alt = title;
            image.hidden = false;
        }
    </script>

</body>
</html>
